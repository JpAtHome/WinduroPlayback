name: Validate track data

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-tracks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check generated catalog
        run: python scripts/update_tracks.py --check --check-catalog-only
      - name: Validate manifest and GPX files
        run: python scripts/validate_tracks.py --by-date-only
