name: Validate track data

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-tracks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate manifest and GPX files
        run: python scripts/validate_tracks.py
